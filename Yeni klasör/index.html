<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merkeziyetsiz Oy Verme Sistemi (DApp)</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
</head>
<body>

    <div class="container">
        <header>
            <h2>🗳️ E-Voting Web3 Panel</h2>
            <div class="wallet-section">
                <button id="connectWalletBtn">MetaMask Bağla</button>
                <p id="walletAddress">Cüzdan Bağlı Değil</p>
            </div>
        </header>

        <hr>

        <div id="adminPanel" class="card admin-card">
            <h3>🛠️ Seçim Yönetim Paneli (Sadece Yetkili)</h3>
            <div class="input-group">
                <input type="text" id="candidateNameInput" placeholder="Adayın Adı Soyadı">
                <button id="addCandidateBtn">Aday Ekle</button>
            </div>
        </div>

        <div class="card">
            <h3>📊 Güncel Adaylar ve Oy Sayıları</h3>
            <div id="candidatesList" class="candidates-grid">
                <p class="loading-text">Veriler yükleniyor veya cüzdan bağlı değil...</p>
            </div>
        </div>

        <div id="statusMessage" class="status"></div>
    </div>

    <script>
        // Sizin paylaştığınız güncel Sepolia verileri
        const contractAddress = "0x64683590BEA9c35d2D5B30e9FA73eEE77F84bc0f";
        const contractABI = [
            {
                "inputs": [{ "internalType": "string", "name": "_name", "type": "string" }],
                "name": "addCandidate",
                "outputs": [],
                "stateMutability": "nonpayable",
                "type": "function"
            },
            {
                "inputs": [],
                "stateMutability": "nonpayable",
                "type": "constructor"
            },
            {
                "inputs": [{ "internalType": "uint256", "name": "_candidateId", "type": "uint256" }],
                "name": "vote",
                "outputs": [],
                "stateMutability": "nonpayable",
                "type": "function"
            },
            {
                "inputs": [],
                "name": "getCandidateCount",
                "outputs": [{ "internalType": "uint256", "name": "", "type": "uint256" }],
                "stateMutability": "view",
                "type": "function"
            },
            {
                "inputs": [],
                "name": "getCandidates",
                "outputs": [
                    {
                        "components": [
                            { "internalType": "uint256", "name": "id", "type": "uint256" },
                            { "internalType": "string", "name": "name", "type": "string" },
                            { "internalType": "uint256", "name": "voteCount", "type": "uint256" }
                        ],
                        "internalType": "struct VotingSystem.Candidate[]",
                        "name": "",
                        "type": "tuple[]"
                    }
                ],
                "stateMutability": "view",
                "type": "function"
            },
            {
                "inputs": [{ "internalType": "address", "name": "", "type": "address" }],
                "name": "hasVoted",
                "outputs": [{ "internalType": "bool", "name": "", "type": "bool" }],
                "stateMutability": "view",
                "type": "function"
            },
            {
                "inputs": [],
                "name": "owner",
                "outputs": [{ "internalType": "address", "name": "", "type": "address" }],
                "stateMutability": "view",
                "type": "function"
            }
        ];

        let provider;
        let signer;
        let contract;
        let userAddress = "";

        const connectWalletBtn = document.getElementById('connectWalletBtn');
        const walletAddressTxt = document.getElementById('walletAddress');
        const statusMessage = document.getElementById('statusMessage');
        const candidatesList = document.getElementById('candidatesList');

        // Cüzdan Bağlama Fonksiyonu
        async function connectWallet() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    showStatus("Cüzdana bağlanılıyor...", "info");
                    provider = new ethers.BrowserProvider(window.ethereum);
                    
                    await provider.send("eth_requestAccounts", []);
                    signer = await provider.getSigner();
                    userAddress = await signer.getAddress();
                    
                    contract = new ethers.Contract(contractAddress, contractABI, signer);

                    walletAddressTxt.innerText = `Bağlı: ${userAddress.substring(0,6)}...${userAddress.substring(userAddress.length - 4)}`;
                    connectWalletBtn.innerText = "Bağlandı";
                    connectWalletBtn.style.backgroundColor = "#2ecc71";
                    showStatus("Cüzdan bağlantısı başarılı!", "success");

                    // Arayüzü güncelle ve verileri çek
                    checkAdminStatus();
                    loadCandidates();
                } catch (error) {
                    console.error(error);
                    showStatus("Bağlantı reddedildi.", "error");
                }
            } else {
                showStatus("MetaMask yüklü değil! Lütfen eklentiyi kurun.", "error");
            }
        }

        // Admin (Owner) Kontrolü
        async function checkAdminStatus() {
            try {
                const contractOwner = await contract.owner();
                const adminPanel = document.getElementById('adminPanel');
                if (userAddress.toLowerCase() === contractOwner.toLowerCase()) {
                    adminPanel.style.display = "block"; // Sadece admin ise paneli göster
                } else {
                    adminPanel.style.display = "none";
                }
            } catch (e) {
                console.error("Owner kontrolü yapılamadı", e);
            }
        }

        // Yeni Aday Ekleme (Sadece Owner)
        async function addCandidate() {
            const name = document.getElementById('candidateNameInput').value;
            if (!name) return showStatus("Lütfen bir aday ismi girin.", "error");

            try {
                showStatus("Aday ekleme işlemi onay bekliyor...", "info");
                const tx = await contract.addCandidate(name);
                showStatus("İşlem blokzincire yazılıyor...", "info");
                await tx.wait();
                showStatus(`"${name}" başarıyla aday olarak eklendi!`, "success");
                document.getElementById('candidateNameInput').value = "";
                loadCandidates();
            } catch (error) {
                console.error(error);
                showStatus("İşlem başarısız oldu veya reddedildi.", "error");
            }
        }

        // Adayları Listeleme ve Dinamik Arayüz Oluşturma
        async function loadCandidates() {
            try {
                const candidates = await contract.getCandidates();
                const userHasVoted = await contract.hasVoted(userAddress);
                
                candidatesList.innerHTML = ""; // Mevcut listeyi temizle

                if (candidates.length === 0) {
                    candidatesList.innerHTML = "<p class='no-data'>Henüz eklenmiş bir aday bulunmuyor.</p>";
                    return;
                }

                candidates.forEach(candidate => {
                    const candidateId = candidate.id.toString();
                    const candidateName = candidate.name;
                    const voteCount = candidate.voteCount.toString();

                    // Her aday için bir html kartı oluşturuyoruz
                    const candidateCard = document.createElement('div');
                    candidateCard.className = "candidate-card";
                    
                    candidateCard.innerHTML = `
                        <div class="candidate-info">
                            <span class="badge">ID: ${candidateId}</span>
                            <h4>${candidateName}</h4>
                        </div>
                        <div class="vote-info">
                            <span class="vote-count">${voteCount} Oy</span>
                            <button class="vote-btn" onclick="vote(${candidateId})" ${userHasVoted ? 'disabled' : ''}>
                                ${userHasVoted ? 'Oy Kullandınız' : 'Oy Ver'}
                            </button>
                        </div>
                    `;
                    candidatesList.appendChild(candidateCard);
                });
            } catch (error) {
                console.error("Adaylar yüklenirken hata oluştu:", error);
                candidatesList.innerHTML = "<p class='error-text'>Veriler çekilemedi.</p>";
            }
        }

        // Oy Verme Fonksiyonu
        async function vote(id) {
            try {
                showStatus(`${id} ID'li aday için oy işlemi bekleniyor...`, "info");
                const tx = await contract.vote(id);
                showStatus("Oy işlemi ağda onaylanıyor...", "info");
                await tx.wait();
                showStatus("Oyunuz başarıyla kaydedildi! Teşekkürler.", "success");
                loadCandidates();
            } catch (error) {
                console.error(error);
                showStatus("Oy verme işlemi iptal edildi veya başarısız oldu.", "error");
            }
        }

        // Bilgilendirme Mesaj Yönetimi
        function showStatus(msg, type) {
            statusMessage.innerText = msg;
            statusMessage.className = "status " + type;
            if (type === "success") {
                setTimeout(() => { statusMessage.innerText = ""; statusMessage.className = "status"; }, 5000);
            }
        }

        // Buton Dinleyicileri
        connectWalletBtn.addEventListener('click', connectWallet);
        document.getElementById('addCandidateBtn').addEventListener('click', addCandidate);

        // Hesap Değişikliklerini Takip Etme
        if (window.ethereum) {
            window.ethereum.on('accountsChanged', function (accounts) {
                if(accounts.length > 0) {
                    connectWallet();
                } else {
                    location.reload();
                }
            });
        }
    </script>
</body>
</html>
