<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web 3.0 Sayı Deposu</title>
    <link rel="stylesheet" href="style.css">
    <!-- Ethers.js Kütüphanesi -->
    <script src="https://cdn.ethers.io/lib/ethers-5.7.umd.min.js" type="application/javascript"></script>
</head>
<body>
    <div class="container">
        <h1>Blockchain Veri Paneli</h1>
        <div id="wallet-section">
            <button id="connectWallet">Cüzdanı Bağla</button>
            <p id="walletAddress">Cüzdan Bağlı Değil</p>
        </div>

        <hr>

        <div class="action-section">
            <h3>Sayı Kaydet (store)</h3>
            <input type="number" id="numberInput" placeholder="Bir sayı girin">
            <button id="storeButton">Blockchain'e Gönder</button>
        </div>

        <div class="display-section">
            <h3>Verileri Görüntüle</h3>
            <button id="refreshButton">Verileri Güncelle</button>
            <div class="data-card">
                <p><strong>Toplam Adet:</strong> <span id="countDisplay">0</span></p>
                <p><strong>Tüm Sayılar:</strong> <span id="allNumbersDisplay">-</span></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
